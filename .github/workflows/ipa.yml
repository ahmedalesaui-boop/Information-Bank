name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create iOS project
        run: |
          mkdir www
          cp "$(ls *.html | head -n1)" www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init InfoBank com.example.infobank --web-dir www
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
